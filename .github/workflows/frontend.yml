# This workflow installs frontend dependencies with bun, then builds and tests the Angular app.
# For more information see: https://bun.sh/guides/runtime/cicd

name: Frontend CI with Bun

on:
  push:
    branches: [ "master" ]
    paths: [ "frontend/**", ".github/workflows/frontend.yml" ]
  pull_request:
    branches: [ "master" ]
    paths: [ "frontend/**", ".github/workflows/frontend.yml" ]

jobs:
  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run --bun build
      - name: Test
        run: bun run --bun test
